name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # docs/performance-budgets.md: CI asserts every budget at 4x, in both runners. The factor is
  # measured, not chosen: budget 4's pane layout-to-paint is 54-59 ms on the reference laptop and
  # 214 ms on this runner, so the runner is ~3.9x. At the old 2x it failed one of two runs at the
  # same commit, which is a flake, not a regression signal.
  BUDGET_FACTOR: '4'

jobs:
  check:
    name: check and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # lint, tsc, vitest (both projects), vite build, bundle budgets, licence allowlist, notices
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
