<style>

  .C .stat { display:inline-block; margin-right:14px; } .C .stat b { font-size:22px; display:block; line-height:1; } .C .stat span { color:var(--muted); font-size:11px; }

<script>

const A = n => [...byId.values()].find(a => a.project === n); const I = n => id(A(n));
[['storefront','api-gateway'],['admin-portal','api-gateway'],['mobile-bff','api-gateway'],['ios-app','mobile-bff'],['android-app','mobile-bff'],['help-center','kb-search'],['seo-renderer','catalog'],
 ['api-gateway','auth-service'],['api-gateway','user-service'],['api-gateway','rate-limiter'],['api-gateway','feature-flags'],['auth-service','session-service'],['auth-service','secrets-broker'],['user-service','audit-log'],['notification-service','user-service'],
 ['checkout','cart'],['checkout','payments'],['checkout','order-service'],['checkout','promotions'],['cart','catalog'],['cart','inventory'],['cart','pricing'],['pricing','promotions'],['order-service','inventory'],['order-service','shipping'],['returns','order-service'],['returns','payments'],['inventory','warehouse-ops'],
 ['payments','fraud-scoring'],['payments','ledger'],['payouts','ledger'],['invoicing','ledger'],['fraud-scoring','ml-features'],
 ['shipping','carrier-gateway'],['tracking','carrier-gateway'],['warehouse-ops','config-service'],
 ['recommendations','ml-features'],['reporting-api','warehouse-loader'],['warehouse-loader','events-pipeline'],['search-indexer','catalog'],['kb-search','search-indexer'],
 ['ticketing','user-service'],['chat-widget','ticketing'],['monolith','postgres-main'],['batch-jobs','monolith'],['storefront','monolith'],['admin-portal','reporting-api'],['admin-portal','ticketing']].forEach(([a,b]) => { const t = A(b) ? I(b) : 'external:'+b; dep(A(a), t); });
for (const a of apps) { if (a.kind !== 'library' && rnd() < .75) dep(a, 'external:' + pick(['postgres-main','postgres-main','redis','elasticsearch','snowflake','s3-events']).replace(/^/,'')); if (['auth-service','api-gateway','admin-portal'].includes(a.project)) dep(a,'external:okta'); if (a.project==='payments') dep(a,'external:stripe'); if (a.project==='notification-service') dep(a,'external:sendgrid'); }
// flows
const pub = (n, c) => A(n).publishes.push(c), sub = (n, c) => A(n).subscribes.push(c);
pub('order-service','orders.placed'); pub('shipping','orders.shipped'); pub('user-service','users.updated'); pub('payments','payments.settled'); pub('inventory','inventory.changed'); pub('ticketing','tickets.opened');
sub('notification-service','orders.placed'); sub('notification-service','orders.shipped'); sub('notification-service','users.updated'); sub('events-pipeline','orders.placed'); sub('events-pipeline','payments.settled'); sub('events-pipeline','users.updated'); sub('inventory','orders.placed'); sub('search-indexer','inventory.changed'); sub('ledger','payments.settled'); sub('recommendations','orders.placed'); sub('chat-widget','tickets.opened'); sub('tracking','orders.shipped');
for (const a of apps) if (a.publishes.length || a.subscribes.length) dep(a, 'external:kafka');
const CATALOG = { schemaVersion: 1, generatedAt: new Date().toISOString(), source: 'PROTOTYPE generator', applications: apps, externals: EXTERNALS };

// ---------------- model ----------------
const M = (() => {
  const nodes = new Map(); for (const a of CATALOG.applications) nodes.set(id(a), { id: id(a), app: a, kind: 'app', label: a.project, deps: [], dependents: [] });
  for (const e of CATALOG.externals) nodes.set('external:' + e.id, { id: 'external:' + e.id, ext: e, kind: 'external', label: e.name || e.id, deps: [], dependents: [] });

    for (let d = 1; d <= maxDepth && frontier.length; d++) { const next = []; for (const n of frontier) for (const m of n[dir]) if (!seen.has(m.id)) { seen.add(m.id); next.push(m); } if (!next.length) break; levels.push(next); frontier = next; }

// ---------------- shared helpers ----------------
const $ = s => document.querySelector(s); const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const state = { selected: null, depth: 99, dir: 'dependents', group: 'none', focus: true };
const params = new URLSearchParams(location.search); const VARIANTS = { A: 'Canvas-first', B: 'Outline-first (incident doc)', C: 'Impact board (three columns)' }; let variant = VARIANTS[params.get('variant')] ? params.get('variant') : 'A';
if (params.get('app') && M.nodes.has(params.get('app'))) state.selected = params.get('app');
const appLink = n => `<a class="app" data-sel="${esc(n.id)}">${esc(n.label)}</a>`;
const teamChip = n => n.app ? `<span class="chip team">${esc(n.app.team)}</span>` : `<span class="chip ext">${esc(n.ext.kind)}</span>`;
const attrRows = a => Object.entries({ repository: a.repository, kind: a.kind, team: a.team, ...(a.attributes || {}) }).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
function outlineMarkdown(n) { const lines = [`# Blast radius of ${n.id}`, '']; const levels = M.blast(n); levels.forEach((lv, i) => { lines.push(`## Depth ${i + 1} (${lv.length})`); lv.forEach(x => lines.push(`- ${x.id}${x.app ? ' (' + x.app.team + ')' : ''}`)); lines.push(''); }); return lines.join('\n'); }
function elementsFor(center, depth, dir, group) {
  const levels = dir === 'both' ? [...M.walk(center, 'dependents', depth).flat(), ...M.walk(center, 'deps', depth).flat()] : M.walk(center, dir, depth).flat();
  const set = new Map([[center.id, center]]); for (const n of levels) set.set(n.id, n);
  const els = []; const parents = new Set();
  for (const n of set.values()) { const g = group !== 'none' && n.app ? (group === 'repository' ? n.app.repository : n.app.team) : null; if (g) parents.add(g); els.push({ data: { id: n.id, label: n.label, kind: n.kind, center: n.id === center.id, parent: g ? 'g:' + g : undefined } }); }
  for (const g of parents) els.push({ data: { id: 'g:' + g, label: g, kind: 'group' } });

function drawCanvas(container, els, rankDir = 'TB') {

function renderA(root) {

    <main><div class="cy" id="cyA"></div><aside id="sideA"></aside>${n ? '' : `<div class="overlay">${pickerCard('What breaks if it dies?')}</div>`}</main>`;

    const blastL = M.blast(n), blastApps = blastL.flat().filter(x => x.kind === 'app'), teams = M.teamsOf(blastApps);
    $('#sideA').innerHTML = `<h2>${esc(n.id)}</h2><div class="small muted">${esc(n.app.kind)} · owned by <span class="chip team">${esc(n.app.team)}</span></div>

      <h3>Blast radius by depth <button data-md style="float:right;font-size:11px">Copy as Markdown</button></h3>${depthBands(blastL)}
      <h3>Direct Dependencies (${n.deps.length})</h3>${n.deps.map(d => `<div class="item">${d.app ? appLink(d) : `<span class="chip ext">${esc(d.label)}</span>`} ${d.app ? teamChip(d) : ''}</div>`).join('') || '<p class="muted">none</p>'}
      ${n.app.publishes.length || n.app.subscribes.length ? `<h3>Flows</h3>${n.app.publishes.map(c => `<div class="item">publishes <span class="chip">${esc(c)}</span></div>`).join('')}${n.app.subscribes.map(c => `<div class="item">subscribes <span class="chip">${esc(c)}</span></div>`).join('')}` : ''}
      <h3>Attributes</h3><table class="kv">${attrRows(n.app)}</table>`;
    drawCanvas($('#cyA'), elementsFor(n, state.depth, state.dir, state.group), state.dir === 'deps' ? 'TB' : 'BT');
  } else { drawCanvas($('#cyA'), elementsFor(M.ranked[0].n, 2, 'both', 'none'), 'BT'); }
  bindCommon(root);
}
// ---------------- Variant B: outline-first ----------------
function renderB(root) {
  const n = state.selected && M.nodes.get(state.selected);
  const groups = {}; for (const a of CATALOG.applications) (groups[a.repository] ||= []).push(a);
  root.className = 'B'; root.innerHTML = `<div class="bar"><b>App Context Viewer</b> <span class="muted small">PROTOTYPE B · outline-first</span> <span style="flex:1"></span> ${controls()}</div>
    <main><nav><input data-search placeholder="Filter…" style="width:100%;margin-bottom:6px"><div data-results></div>${Object.entries(groups).map(([r, as]) => `<details ${n && n.app.repository === r ? 'open' : ''}><summary><b>${esc(r.split('/')[1])}</b> <span class="muted small">${as.length}</span></summary><div class="tree">${as.map(a => `<div class="node">${appLink(M.nodes.get(id(a)))} <span class="who">${M.blastCount(M.nodes.get(id(a))) || ''}</span></div>`).join('')}</div></details>`).join('')}</nav>
    <section id="secB"></section><aside><div class="cap">Neighborhood, depth 2, ${state.dir === 'deps' ? 'Dependencies' : state.dir === 'both' ? 'both directions' : 'Dependents'}</div><div class="cy" id="cyB"></div></aside></main>`;
  if (!n) { $('#secB').innerHTML = `<h2 style="font-size:18px">Largest blast radius</h2><p class="muted">Click a row, or pick from the index on the left.</p><table class="rank"><tr><th>Application</th><th>Team</th><th>Apps affected</th><th>Teams</th><th>Direct dependents</th></tr>${M.ranked.slice(0, 20).map(r => `<tr data-sel="${esc(r.n.id)}"><td>${esc(r.n.id)}</td><td>${esc(r.n.app.team)}</td><td><b>${r.count}</b></td><td>${r.teams}</td><td>${r.n.dependents.length}</td></tr>`).join('')}</table>`; drawCanvas($('#cyB'), elementsFor(M.ranked[0].n, 2, 'both', 'none'), 'BT'); }
  else {
    const levels = M.walk(n, state.dir === 'deps' ? 'deps' : 'dependents', state.depth); const apps = levels.flat().filter(x => x.kind === 'app');
    const tree = (node, dir, depth, seen) => { const kids = node[dir].filter(k => !seen.has(k.id)); kids.forEach(k => seen.add(k.id)); if (!kids.length || depth > state.depth) return ''; return `<div class="tree">${kids.map(k => { const sub = tree(k, dir, depth + 1, seen); return sub ? `<details ${depth <= 1 ? 'open' : ''}><summary>${appLink(k)} ${teamChip(k)} <span class="muted small">depth ${depth}</span></summary>${sub}</details>` : `<div class="node">${k.app ? appLink(k) : `<span class="chip ext">${esc(k.label)}</span>`} ${teamChip(k)} <span class="muted small">depth ${depth}</span></div>`; }).join('')}</div>`; };
    $('#secB').innerHTML = `<h2 style="font-size:18px">${esc(n.id)}</h2><div class="muted">${esc(n.app.kind)} · <span class="chip team">${esc(n.app.team)}</span> · ${Object.entries(n.app.attributes||{}).map(([k,v])=>`<span class="chip">${esc(k)}: ${esc(v)}</span>`).join('')}</div>
      <p><span class="badge ${apps.length ? 'danger' : 'ok'}">${state.dir === 'deps' ? `${apps.length} Applications it needs` : `${apps.length} Applications break`}</span> <span class="muted">${M.teamsOf(apps).length} teams</span> <button data-md style="margin-left:10px">Copy as Markdown</button></p>
      <h3>${state.dir === 'deps' ? 'Dependency tree' : 'Blast radius tree'} (expand to walk the chain)</h3>${tree(n, state.dir === 'deps' ? 'deps' : 'dependents', 1, new Set([n.id])) || '<p class="muted">none</p>'}
      ${n.app.publishes.length || n.app.subscribes.length ? `<h3>Flows (not part of the blast radius)</h3>${n.app.publishes.map(c => `<span class="chip">→ ${esc(c)}</span>`).join('')}${n.app.subscribes.map(c => `<span class="chip">← ${esc(c)}</span>`).join('')}` : ''}`;
    drawCanvas($('#cyB'), elementsFor(n, 2, state.dir, state.group), state.dir === 'deps' ? 'TB' : 'BT');
  }
  bindCommon(root);
}
// ---------------- Variant C: impact board ----------------
function renderC(root) {
  const n = state.selected && M.nodes.get(state.selected);
  root.className = 'C'; root.innerHTML = `<div class="bar"><b>App Context Viewer</b> <span class="muted small">PROTOTYPE C · impact board</span> <input data-search placeholder="Find application…" size="26"><div data-results style="position:absolute;top:44px;left:200px;z-index:6;background:var(--panel);border:1px solid var(--border);border-radius:6px;min-width:320px"></div><span style="flex:1"></span><label>Depth <select data-state="depth">${[1,2,3,'all'].map(d => `<option value="${d}" ${(d==='all'?99:d)===state.depth?'selected':''}>${d}</option>`).join('')}</select></label><button id="toggleDrawer">Show graph</button></div>
    <main><div class="col" id="left"></div><div class="col mid" id="mid"></div><div class="col" id="right"></div></main><div class="drawer" id="drawer"><div class="cy" id="cyC"></div></div>`;
  if (!n) { $('#mid').innerHTML = pickerCard('Pick an Application'); $('#left').innerHTML = `<div class="colhead"><b>Catalog</b></div><div class="stat"><b>${CATALOG.applications.length}</b><span>Applications</span></div><div class="stat"><b>${Object.keys(REPOS).length}</b><span>Repositories</span></div><div class="stat"><b>${new Set(CATALOG.applications.map(a=>a.team)).size}</b><span>Teams</span></div><div class="stat"><b>${CATALOG.externals.length}</b><span>Externals</span></div><div class="stat"><b>${CHANNELS.length}</b><span>Channels</span></div>`; $('#right').innerHTML = `<div class="colhead"><b>Most depended-on Externals</b></div>${[...M.nodes.values()].filter(x=>x.kind==='external').sort((a,b)=>b.dependents.length-a.dependents.length).map(x=>`<div class="item"><span class="chip ext">${esc(x.label)}</span> <span class="meta">${x.dependents.length} direct dependents</span></div>`).join('')}`; }
  else {
    const depsL = M.walk(n, 'deps', state.depth), blastL = M.walk(n, 'dependents', state.depth); const blastApps = blastL.flat().filter(x => x.kind === 'app');
    $('#left').innerHTML = `<div class="colhead"><b>Needs</b><span class="muted small">Dependencies, ${depsL.flat().length}</span></div>${depsL.map((lv, i) => `<div class="depth d${Math.min(i+1,3)}"><h4>Depth ${i+1} · ${lv.length}</h4>${lv.map(x => `<div class="item">${x.app ? appLink(x) + ' ' + teamChip(x) : `<span class="chip ext">${esc(x.label)}</span> <span class="meta">${esc(x.ext.kind)}</span>`}</div>`).join('')}</div>`).join('') || '<p class="muted">none</p>'}`;
    $('#mid').innerHTML = `<div class="colhead"><b>${esc(n.label)}</b><span class="muted small">${esc(n.app.repository)}</span></div><div class="muted small">${esc(n.app.kind)} · <span class="chip team">${esc(n.app.team)}</span></div>
      <p><span class="badge ${blastApps.length ? 'danger' : 'ok'}">${blastApps.length} break</span> <span class="muted">across ${M.teamsOf(blastApps).length} teams</span></p>
      <div class="stat"><b>${n.deps.length}</b><span>direct deps</span></div><div class="stat"><b>${n.dependents.length}</b><span>direct dependents</span></div><div class="stat"><b>${blastL.length}</b><span>max depth</span></div>
      <h3>Attributes</h3><table class="kv">${attrRows(n.app)}</table>
      ${n.app.publishes.length || n.app.subscribes.length ? `<h3>Flows</h3>${n.app.publishes.map(c => `<div class="item">→ <span class="chip">${esc(c)}</span></div>`).join('')}${n.app.subscribes.map(c => `<div class="item">← <span class="chip">${esc(c)}</span></div>`).join('')}` : ''}
      <h3>Export</h3><button data-md>Copy as Markdown</button>`;
    $('#right').innerHTML = `<div class="colhead"><b>Breaks</b><span class="muted small">Dependents, ${blastApps.length}</span></div>${depthBands(blastL)}`;
    $('#toggleDrawer').onclick = () => { const d = $('#drawer'); d.classList.toggle('open'); if (d.classList.contains('open')) setTimeout(() => drawCanvas($('#cyC'), elementsFor(n, state.depth, 'both', 'none'), 'LR'), 220); };
  }
  bindCommon(root);
}
// ---------------- switcher + boot ----------------
const R = { A: renderA, B: renderB, C: renderC };
function render() { const root = $('#app'); R[variant](root); $('#vlabel').textContent = `${variant} — ${VARIANTS[variant]}`; }
function go(delta) { const keys = Object.keys(VARIANTS); variant = keys[(keys.indexOf(variant) + delta + keys.length) % keys.length]; const u = new URL(location); u.searchParams.set('variant', variant); history.replaceState(null, '', u); render(); }
$('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
document.addEventListener('keydown', e => { if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
render();
</script>
</body>
